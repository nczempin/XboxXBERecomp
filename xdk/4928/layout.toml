# XDK 4928 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Tom Clancy's Splinter Cell) code at the address given.
[layout]
# D3D8 CDevice, the static device D3D_pDevice points at; its miniport is at +0x23C0 (D3DDevice_SetGammaRamp 0x1EEDF3)
CDevice_Push              = 0x0    # D3DDevice_SetTexture 0x1EFBA2 reads it, compares with +4, calls MakeSpace 0x1F3F00
CDevice_PushThreshold     = 0x4    # D3DDevice_SetTexture 0x1EFBA5 compares the push pointer with it
CDevice_BaseVertex        = 0x1C   # D3DDevice_SetIndices 0x1EFD59 stores BaseVertexIndex
CDevice_IndexBuffer       = 0x38C  # D3DDevice_SetIndices 0x1EFD2A reads the old one, 0x1EFD52 stores the new one
CDevice_ZScale            = 0x510  # D3DDevice_GetViewportOffsetAndScale 0x1ED545 scales the Z range by it
CDevice_SuperSampleX      = 0x518  # D3DDevice_GetViewportOffsetAndScale 0x1ED49E scales viewport X by it
CDevice_SuperSampleY      = 0x51C  # D3DDevice_GetViewportOffsetAndScale 0x1ED4C0 scales viewport Y by it
CDevice_Transforms        = 0x810  # D3DDevice_SetTransform 0x1EEE86 copies 16 dwords to +0x810 + type * 64
CDevice_Textures          = 0xB38  # D3DDevice_SetTexture 0x1EFB60 reads, 0x1EFB99 stores [stage]
CDevice_Palettes          = 0xB48  # device teardown 0x1F6424 releases [stage]
CDevice_RenderTarget      = 0x21B4 # D3DDevice_GetRenderTarget2 0x1EF6B0 returns it
CDevice_Depth             = 0x21B8 # D3DDevice_GetDepthStencilSurface2 0x1EF6D0 returns it
CDevice_BackBuffer        = 0x21C0 # D3DDevice_GetBackBuffer2 0x1EF2F5 returns it for index 0
CDevice_FrontBuffer       = 0x21C4 # D3DDevice_GetBackBuffer2 0x1EF2EF returns it for index -1
CDevice_SwapCount         = 0x2C10 # D3DDevice_Swap 0x1F1AD0 increments it, 0x1F1B41 returns it
CDevice_Size              = 0x2C30 # Direct3D_CreateDevice 0x1F314B clears 0xB0C dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x1F30FF ors BehaviorFlags & 0x10 into it
CDevice_Time              = 0x30   # D3D_SetFence 0x1F3BAD reads it, 0x1F3C23 adds 2
CDevice_PixelShader       = 0x370  # D3DDevice_SetPixelShader 0x1F31E8 stores the handle
CDevice_VertexShader      = 0x380  # D3DDevice_SetVertexShader 0x1F2B88 stores the current shader object
CDevice_BackBufferScale   = 0x528  # CDevice_InitializeFrameBuffers 0x1F59BA stores X scale, 0x1F59D3 Y scale at +4
CDevice_ProjectionViewport = 0x530 # D3D_UpdateProjectionViewportTransform 0x1ED6D5 writes 16 dwords, GetProjectionViewportMatrix 0x1EF08C reads them
CDevice_Viewport          = 0xA90  # D3DDevice_GetViewportOffsetAndScale 0x1ED485..0x1ED54F reads X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xAA8  # D3DDevice_SetScreenSpaceOffset 0x1F01C3 stores X, 0x1F01D3 Y at +4
CDevice_AutoDepth         = 0x21CC # CDevice_InitializeFrameBuffers 0x1F5A79 stores the auto depth buffer
CDevice_VBlankCallback    = 0x2550 # vertical blank handler 0x1F6B2E loads [miniport + 0x190]
CDevice_VBlankEvent       = 0x2554 # D3DDevice_BlockUntilVerticalBlank 0x1EF067 waits on it, 0x1EF05B clears SignalState
CDevice_DisplayFlags      = 0x2574 # D3D_GetAdapterDisplayMode 0x1F2FB3 reads it, VBlank handler 0x1F6ACD tests miniport + 0x1B4
CDevice_VBlankCount       = 0x2580 # vertical blank handler 0x1F6A84..0x1F6A91 increments miniport + 0x1C0
CDevice_Field             = 0x2590 # vertical blank handler 0x1F6AF4 stores the field at miniport + 0x1D0
CDevice_GammaRamps        = 0x259C # D3DDevice_SetGammaRamp 0x1EEE23 copies to miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2B9C # D3DDevice_SetGammaRamp 0x1EEE51 sets [miniport + 0x7DC + index * 4]
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x1EFBD7 ors it into D3D_DirtyFlags
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x1EDECB: [stage * 32 + type] dwords
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x1F278A indexes the stream table by n * 12
Stream_Stride             = 0x0    # D3DDevice_SetStreamSource 0x1F27D2 stores Stride
Stream_Buffer             = 0x8    # D3DDevice_SetStreamSource 0x1F27D8 stores the vertex buffer
PixelShader_Definition    = 0x8    # D3DDevice_CreatePixelShader 0x1F31A1 stores the definition pointer, SetPixelShader 0x1F3250 reads it
# DSOUND
CDirectSoundStream_Vtable  = 0x0   # CDirectSoundStream primary vtable slot (matches 4831 and 5659)
CDirectSoundStream_Vtable2 = 0x4   # CDirectSoundStream secondary XMediaObject vtable slot (matches 4831 and 5659)
EffectsImage_Skip0         = 0x804 # 0x23F7B6 (reached from CDirectSound_DownloadEffectsImage 0x23C86D) reads this dword count
EffectsImage_Skip1         = 0x80C # 0x23F7C8 loads this dword count
EffectsImage_Desc          = 0x818 # 0x23F7E6 loads descriptor base at image + 0x818
# XAPI XPP device type record
XPP_Current               = 0x0    # XGetDeviceChanges 0x25A023 reads Current
XPP_Changed               = 0x4    # XGetDeviceChanges 0x25A002 tests Changed, 0x25A043 clears it
XPP_Previous              = 0x8    # XGetDeviceChanges 0x25A01B reads Previous, 0x25A047 copies Current into it
